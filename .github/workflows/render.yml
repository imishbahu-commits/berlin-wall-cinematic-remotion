name: Render Berlin Wall Video

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx remotion render BerlinWall out/berlin-wall.mp4 --codec=h264 --crf=18
      - uses: actions/upload-artifact@v4
        with:
          name: berlin-wall-video
          path: out/berlin-wall.mp4
